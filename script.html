<script>(()=>{'use strict';const $=id=>document.getElementById(id),K={t:'ruito_studio_text',tt:'ruito_studio_title',c:'ruito_studio_code',f:'ruito_studio_filename',l:'ruito_studio_language'};const chatHistory=[];let chatBusy=false;const titles={home:'ホーム',chat:'AIチャット',talk:'AUTO TALK',text:'文章エディター',code:'コードエディター',image:'画像スタジオ',video:'動画スタジオ',audio:'音声スタジオ',files:'ファイル管理'};function saved(){ $('save-state').textContent='保存しました';clearTimeout(saved.timer);saved.timer=setTimeout(()=>$('save-state').textContent='ローカル保存対応',1000)}function put(k,v){try{localStorage.setItem(k,v);saved()}catch(e){$('save-state').textContent='保存容量を確認してね'}}function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('page-title').textContent=titles[v];$('sidebar').classList.remove('open')}document.querySelectorAll('[data-view]').forEach(x=>x.addEventListener('click',()=>show(x.dataset.view)));$('mobile-menu').onclick=()=>$('sidebar').classList.toggle('open');$('new-project').onclick=()=>{if(confirm('文章・コードを空にしますか？')){['text-title','text-editor','code-editor'].forEach(id=>$(id).value='');put(K.tt,'');put(K.t,'');put(K.c,'');show('text')}};[['text-title',K.tt],['text-editor',K.t],['code-editor',K.c],['code-filename',K.f],['code-language',K.l]].forEach(([id,k])=>{$(id).value=localStorage.getItem(k)||$(id).value;$(id).addEventListener('input',e=>put(k,e.target.value));$(id).addEventListener('change',e=>put(k,e.target.value))});function dl(n,c,type='text/plain;charset=utf-8'){const u=URL.createObjectURL(new Blob([c],{type})),a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('export-text').onclick=()=>dl((($('text-title').value||'document').replace(/[\\/:*?"<>|]/g,'_'))+'.txt',$('text-editor').value);$('export-code').onclick=()=>dl($('code-filename').value||'code.txt',$('code-editor').value);$('clear-text').onclick=()=>{if(confirm('文章を消去しますか？')){$('text-editor').value='';put(K.t,'')}};$('clear-code').onclick=()=>{if(confirm('コードを消去しますか？')){$('code-editor').value='';put(K.c,'')}};let imageSource=null,imageName='image';
function drawImage(){if(!imageSource)return;const canvas=$('image-canvas'),ctx=canvas.getContext('2d'),rot=Number($('img-rotate').value),swap=rot===90||rot===270;canvas.width=swap?imageSource.naturalHeight:imageSource.naturalWidth;canvas.height=swap?imageSource.naturalWidth:imageSource.naturalHeight;ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rot*Math.PI/180);ctx.filter='brightness('+Number($('img-brightness').value)+'%) contrast('+Number($('img-contrast').value)+'%)';ctx.drawImage(imageSource,-imageSource.naturalWidth/2,-imageSource.naturalHeight/2);ctx.restore();const box=$('image-preview');box.textContent='';const preview=document.createElement('img');preview.src=canvas.toDataURL('image/png');preview.alt='調整後の画像プレビュー';preview.style.cssText='max-width:100%;max-height:55vh;object-fit:contain';box.appendChild(preview)}
$('image-input').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;imageName=f.name.replace(/\\.[^.]+$/,'')||'image';const im=new Image();im.onload=()=>{imageSource=im;drawImage()};im.onerror=()=>alert('画像を読み込めませんでした');im.src=URL.createObjectURL(f)});
['img-brightness','img-contrast','img-rotate'].forEach(id=>$(id).addEventListener('input',drawImage));$('img-reset').onclick=()=>{$('img-brightness').value=100;$('img-contrast').value=100;$('img-rotate').value=0;drawImage()};$('img-export').onclick=()=>{if(!$('image-canvas').width){alert('先に画像を選択してください');return}$('image-canvas').toBlob(blob=>{if(!blob){alert('PNGを書き出せませんでした');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=imageName+'-edited.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};
$('video-input').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const v=$('video-preview');v.src=URL.createObjectURL(f);v.onloadedmetadata=()=>{$('video-start').value=0;$('video-end').value=Number.isFinite(v.duration)?v.duration.toFixed(1):0;$('video-info').textContent='長さ：'+v.duration.toFixed(1)+'秒 / '+v.videoWidth+'×'+v.videoHeight}});
$('video-play-range').onclick=()=>{const v=$('video-preview'),s=Math.max(0,Number($('video-start').value)||0),e=Number($('video-end').value);if(!v.src||!Number.isFinite(v.duration)){alert('先に動画を選択してください');return}if(e<=s||s>=v.duration||e>v.duration+0.1){alert('開始・終了位置を確認してください');return}v.currentTime=s;v.play();v.ontimeupdate=()=>{if(v.currentTime>=e){v.pause();v.ontimeupdate=null}}};
$('video-set-start').onclick=()=>{$('video-start').value=$('video-preview').currentTime.toFixed(1)};$('video-set-end').onclick=()=>{$('video-end').value=$('video-preview').currentTime.toFixed(1)};
$('audio-input').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)$('audio-preview').src=URL.createObjectURL(f)});$('audio-volume').oninput=e=>$('audio-preview').volume=Number(e.target.value)/100;$('audio-speed').onchange=e=>$('audio-preview').playbackRate=Number(e.target.value);$('export-workspace').onclick=()=>dl('ruito-studio-workspace.json',JSON.stringify({app:'ルイトAI STUDIO',version:1,textTitle:$('text-title').value,text:$('text-editor').value,codeFilename:$('code-filename').value,codeLanguage:$('code-language').value,code:$('code-editor').value},null,2),'application/json');$('import-workspace').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());$('text-title').value=d.textTitle||'';$('text-editor').value=d.text||'';$('code-filename').value=d.codeFilename||'main.html';$('code-language').value=d.codeLanguage||'html';$('code-editor').value=d.code||'';[[K.tt,'text-title'],[K.t,'text-editor'],[K.f,'code-filename'],[K.l,'code-language'],[K.c,'code-editor']].forEach(([k,id])=>localStorage.setItem(k,$(id).value));saved();alert('作業データを読み込みました')}catch(_){alert('JSONを読み込めませんでした')}};
function renderChat(){const box=$('chat-messages');box.textContent='';if(!chatHistory.length){const empty=document.createElement('div');empty.className='chat-empty';empty.textContent='🤖 ルイトAIに話しかけてみよう！';box.appendChild(empty);return}chatHistory.forEach(m=>{const el=document.createElement('div');el.className='chat-bubble '+m.role;el.textContent=m.content;box.appendChild(el)});box.scrollTop=box.scrollHeight}
function setChatBusy(v){chatBusy=v;$('chat-send').disabled=v;$('chat-input').disabled=v;$('chat-status').textContent=v?'ルイトAIが考え中...':'入力できます'}
$('chat-form').addEventListener('submit',e=>{e.preventDefault();const text=$('chat-input').value.trim();if(!text||chatBusy)return;if(!(typeof google!=='undefined'&&google.script&&google.script.run)){alert('GASウェブアプリとして開いてください。');return}chatHistory.push({role:'user',content:text});$('chat-input').value='';renderChat();setChatBusy(true);google.script.run.withSuccessHandler(result=>{chatHistory.push({role:'assistant',content:result.text});if(chatHistory.length>12)chatHistory.splice(0,chatHistory.length-12);renderChat();setChatBusy(false)}).withFailureHandler(err=>{chatHistory.pop();renderChat();setChatBusy(false);$('chat-status').textContent='エラー';alert(err&&err.message?err.message:'AI接続に失敗しました')}).sendChatMessage(chatHistory.slice(-12))});
$('clear-chat').addEventListener('click',()=>{if(chatBusy)return;chatHistory.length=0;renderChat();$('chat-status').textContent='会話を消去しました'});
const TALK_KEY='ruito_studio_talk_log';let talkBusy=false;
function renderTalk(){const box=$('talk-log'),saved=localStorage.getItem(TALK_KEY)||'';box.textContent='';if(!saved){const empty=document.createElement('div');empty.className='chat-empty';empty.textContent='テーマを入力して「会議を開始」を押してください。';box.appendChild(empty);return}const pre=document.createElement('pre');pre.className='talk-result';pre.textContent=saved;box.appendChild(pre)}
$('start-talk').addEventListener('click',()=>{const topic=$('talk-topic').value.trim();if(!topic||talkBusy)return;if(!(typeof google!=='undefined'&&google.script&&google.script.run)){alert('GASウェブアプリとして開いてください。');return}talkBusy=true;$('start-talk').disabled=true;$('talk-status').textContent='会議中...';$('talk-log').textContent='3つの役割で会議を進めています...';google.script.run.withSuccessHandler(result=>{localStorage.setItem(TALK_KEY,'テーマ：'+topic+'\\n\\n'+result.text+'\\n\\n---\\n接続：OpenAI実接続 / Gemini '+(result.providers&&result.providers.gemini?'実接続':'シミュレーション')+' / Copilot シミュレーション');renderTalk();talkBusy=false;$('start-talk').disabled=false;$('talk-status').textContent='会議完了'}) .withFailureHandler(err=>{talkBusy=false;$('start-talk').disabled=false;$('talk-status').textContent='エラー';$('talk-log').textContent=err&&err.message?err.message:'会議に失敗しました'}) .runAutoTalk(topic)});
$('clear-talk').addEventListener('click',()=>{if(talkBusy)return;if(confirm('会議ログを消去しますか？')){localStorage.removeItem(TALK_KEY);renderTalk();$('talk-status').textContent='ログを消去しました'}});
renderTalk();
if(typeof google!=='undefined'&&google.script&&google.script.run){google.script.run.withSuccessHandler(s=>{$('provider-status').textContent='接続設定：OpenAI '+(s.openai?'設定済み':'未設定')+' / Gemini '+(s.gemini?'設定済み':'未設定（企画役はシミュレーション）')+' / Copilot APIは未接続（開発役をシミュレーション）'}).getAiProviderStatus()}
function workspaceData(){return {app:'ルイトAI STUDIO',version:1,savedAt:new Date().toISOString(),textTitle:$('text-title').value,text:$('text-editor').value,codeFilename:$('code-filename').value,codeLanguage:$('code-language').value,code:$('code-editor').value}}
function applyWorkspace(d){$('text-title').value=d.textTitle||'';$('text-editor').value=d.text||'';$('code-filename').value=d.codeFilename||'main.html';$('code-language').value=d.codeLanguage||'html';$('code-editor').value=d.code||'';[[K.tt,'text-title'],[K.t,'text-editor'],[K.f,'code-filename'],[K.l,'code-language'],[K.c,'code-editor']].forEach(([k,id])=>localStorage.setItem(k,$(id).value));saved()}
function driveCall(method,arg,success){if(!(typeof google!=='undefined'&&google.script&&google.script.run)){$('drive-status').textContent='GASウェブアプリとして開いてください。';return}const runner=google.script.run.withSuccessHandler(success).withFailureHandler(err=>$('drive-status').textContent=err&&err.message?err.message:'Drive操作に失敗しました');if(arg===undefined)runner[method]();else runner[method](arg)}
function refreshDrive(){ $('drive-status').textContent='Driveの保存一覧を取得中...';driveCall('listWorkspaceFiles',undefined,files=>{const box=$('drive-list');box.textContent='';if(!files.length){$('drive-status').textContent='保存ファイルはまだありません。';return}$('drive-status').textContent=files.length+'件の保存ファイル';files.forEach(f=>{const row=document.createElement('div');row.className='drive-file';const name=document.createElement('span');name.textContent=f.name;const btn=document.createElement('button');btn.className='button';btn.textContent='読み込む';btn.onclick=()=>{if(!confirm(f.name+' を読み込みますか？現在の文章・コードを置き換えます。'))return;$('drive-status').textContent='読み込み中...';driveCall('loadWorkspaceFromDrive',f.id,d=>{applyWorkspace(d);$('drive-status').textContent=f.name+' を読み込みました'})};row.append(name,btn);box.appendChild(row)})})}
$('drive-save').onclick=()=>{if(!confirm('現在の文章・コードをGoogle Driveに保存しますか？'))return;$('drive-status').textContent='Driveに保存中...';driveCall('saveWorkspaceToDrive',workspaceData(),f=>{$('drive-status').textContent='保存しました：'+f.name;refreshDrive()})};
$('drive-refresh').onclick=refreshDrive;
renderChat();if(typeof google!=='undefined'&&google.script&&google.script.run){google.script.run.withSuccessHandler(()=>{$('connection-label').textContent='GAS接続済み'}).withFailureHandler(()=>$('connection-label').textContent='GAS応答待ち').getAppInfo()}else $('connection-label').textContent='ブラウザープレビュー'})();</script>
