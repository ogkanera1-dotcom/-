<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="ルイトAI AUTO TALK — AI会議のデモ">
  <title>ルイトAI AUTO TALK</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">APIなしで動くデモ</p>
      <h1>🤖 ルイトAI <span>AUTO TALK</span></h1>
      <p class="intro">テーマを決めて、AI会議を始めよう。ChatGPTとCopilotが参加し、Geminiの席は空けてあります 🌟</p>
    </header>

    <section class="panel controls" aria-labelledby="controls-title">
      <h2 id="controls-title">会議のテーマ</h2>
      <form id="meeting-form">
        <label class="visually-hidden" for="topic">会議のテーマを入力</label>
        <input id="topic" name="topic" type="text" maxlength="160" placeholder="例：学校で使える楽しいアプリを考えよう" required>
        <div class="button-row">
          <button id="start-button" class="button primary" type="submit">会議スタート</button>
          <button id="stop-button" class="button secondary" type="button" disabled>停止</button>
          <button id="clear-button" class="button quiet" type="button">ログを消去</button>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="polite">待機中 — テーマを入力してね</p>
    </section>

    <section class="panel meeting" aria-labelledby="meeting-title">
      <div class="section-heading">
        <h2 id="meeting-title">会議ログ</h2>
        <span class="demo-badge">DEMO</span>
      </div>
      <div class="participants" aria-label="参加者">
        <span>🧠 ChatGPT <small>設計・参加中</small></span>
        <span>🌟 Gemini <small>一時退出中・席確保</small></span>
        <span>💻 Copilot <small>開発・参加中</small></span>
      </div>
      <ol id="chat-log" class="chat-log" aria-live="polite" aria-relevant="additions"></ol>
      <p id="empty-state" class="empty-state">会議ログはまだありません。開始するとChatGPTとCopilotのデモ発言が順番に表示されます。</p>
    </section>
    <footer>このデモの発言は固定スクリプトです。本物のAI APIには接続していません。</footer>
  </main>
</body>
</html>
